<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#213329" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f5f3ec"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="220" height="900" fill="#efeee8"/>
    <line x1="220" y1="0" x2="220" y2="900" stroke="#d8d6ce"/>
    <rect x="1350" width="250" height="900" fill="#f0f1ed"/>
    <line x1="1350" y1="0" x2="1350" y2="900" stroke="#d8d9d3"/>

    <g transform="translate(24 28)">
      <circle cx="20" cy="20" r="20" fill="#171715"/>
      <text x="20" y="27" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fff">e</text>
      <text x="52" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1c1c19">econpaper</text>
    </g>
    <g transform="translate(20 98)">
      <rect width="180" height="46" rx="14" fill="#fff"/>
      <circle cx="25" cy="23" r="11" fill="none" stroke="#77756e"/>
      <path d="M25 18v10M20 23h10" stroke="#77756e" stroke-linecap="round"/>
      <text x="48" y="29" font-size="15" fill="#36352f">新论文</text>
    </g>
    <text x="24" y="190" font-size="13" fill="#8b8981">对话</text>
    <rect x="14" y="206" width="192" height="62" rx="12" fill="#e2e1da"/>
    <text x="26" y="231" font-size="14" font-weight="650" fill="#292823">数字经济与企业生产率</text>
    <text x="26" y="253" font-size="12" fill="#77756e">方向凝练 · 进行中</text>
    <text x="24" y="304" font-size="13" fill="#8b8981">资料</text>
    <text x="28" y="342" font-size="14" fill="#4f4d47">＋ 上传数据</text>
    <text x="28" y="380" font-size="14" fill="#4f4d47">＋ 添加文献</text>
    <g transform="translate(20 828)">
      <circle cx="18" cy="18" r="18" fill="#1d1d1a"/>
      <text x="48" y="24" font-size="14" fill="#36352f">我的研究</text>
    </g>

    <g transform="translate(197 424)">
      <rect width="46" height="52" rx="16" fill="#fff" stroke="#d3d1c9"/>
      <path d="M27 17l-7 9 7 9" fill="none" stroke="#68665f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="4" cy="26" r="2.5" fill="#b2afa5"/>
    </g>

    <g transform="translate(1380 36)">
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#282925">论文工作台</text>
      <text x="0" y="54" font-size="13" fill="#777a72">方向凝练 · 可追溯</text>
      <line x1="0" y1="82" x2="190" y2="82" stroke="#dadbd5"/>
      <text x="0" y="120" font-size="12" fill="#8b8e86">当前研究问题</text>
      <text x="0" y="150" font-size="14" fill="#33352f">数字经济发展是否提高</text>
      <text x="0" y="173" font-size="14" fill="#33352f">制造业企业生产率</text>
      <text x="0" y="224" font-size="12" fill="#8b8e86">进度</text>
      <circle cx="7" cy="256" r="6" fill="#2f674d"/>
      <text x="24" y="262" font-size="14" font-weight="650" fill="#33352f">方向凝练</text>
      <line x1="7" y1="267" x2="7" y2="302" stroke="#cfd1ca"/>
      <circle cx="7" cy="315" r="6" fill="#d0d2cb"/>
      <text x="24" y="321" font-size="14" fill="#6f726a">数据准备</text>
      <line x1="7" y1="326" x2="7" y2="361" stroke="#cfd1ca"/>
      <circle cx="7" cy="374" r="6" fill="#d0d2cb"/>
      <text x="24" y="380" font-size="14" fill="#6f726a">识别与估计</text>
      <text x="0" y="444" font-size="12" fill="#8b8e86">本轮只处理</text>
      <rect x="0" y="460" width="190" height="62" rx="13" fill="#fff" stroke="#daddd6"/>
      <text x="16" y="487" font-size="13" fill="#34362f">确定第一个比较问题</text>
      <text x="16" y="508" font-size="11" fill="#85887f">其他步骤暂不展开</text>
    </g>
    <g transform="translate(1327 424)">
      <rect width="46" height="52" rx="16" fill="#fff" stroke="#d3d5cf"/>
      <path d="M19 17l7 9-7 9" fill="none" stroke="#686b64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="42" cy="26" r="2.5" fill="#b2b5ae"/>
    </g>

    <g transform="translate(292 36)">
      <text x="0" y="22" font-size="13" fill="#85837b">数字经济与制造业生产率</text>
      <rect x="900" y="0" width="126" height="38" rx="19" fill="#ebe9e1"/>
      <text x="963" y="25" text-anchor="middle" font-size="13" fill="#585750">方向凝练 · 1</text>
    </g>
    <line x1="220" y1="92" x2="1350" y2="92" stroke="#dedbd1"/>

    <g transform="translate(350 136)">
      <text x="0" y="22" font-size="14" fill="#85837b">你</text>
      <rect x="0" y="40" width="870" height="72" rx="20" fill="#eceae3"/>
      <text x="25" y="84" font-size="20" fill="#24231f">我想研究数字经济发展是否提高了制造业企业的生产率</text>
    </g>

    <g transform="translate(350 282)">
      <circle cx="18" cy="18" r="18" fill="#2f674d"/>
      <text x="18" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#fff">e</text>
      <text x="50" y="24" font-size="14" font-weight="700" fill="#2f674d">econpaper</text>
      <text x="50" y="76" font-family="Georgia, 'Songti SC', serif" font-size="24" fill="#21211e">我先忠实保留你的研究意图：</text>
      <text x="50" y="120" font-family="Georgia, 'Songti SC', serif" font-size="28" font-weight="700" fill="#1a1a18">数字经济发展 → 制造业企业 → 生产率</text>
      <text x="50" y="170" font-size="18" fill="#56554f">先不展开整套研究流程。现在只确定下一件事：</text>
      <text x="50" y="208" font-size="20" font-weight="650" fill="#25241f">你最想先弄清哪一种问题？</text>
      <g transform="translate(50 242)" font-size="15">
        <rect width="158" height="48" rx="24" fill="#fff" stroke="#d6d3c8"/>
        <text x="79" y="30" text-anchor="middle" fill="#31302b">整体是否有效</text>
        <rect x="174" width="184" height="48" rx="24" fill="#fff" stroke="#d6d3c8"/>
        <text x="266" y="30" text-anchor="middle" fill="#31302b">哪些企业更明显</text>
        <rect x="374" width="170" height="48" rx="24" fill="#fff" stroke="#d6d3c8"/>
        <text x="459" y="30" text-anchor="middle" fill="#31302b">通过什么机制</text>
        <text x="570" y="30" fill="#77756e">我想自己描述</text>
      </g>
      <text x="50" y="340" font-size="14" fill="#8b8981">原话持续保留；步骤在需要时进入对话，两侧只承载导航与状态。</text>
    </g>

    <g transform="translate(350 728)" filter="url(#shadow)">
      <rect width="870" height="92" rx="27" fill="#fffdf8" stroke="#d8d5ca"/>
      <circle cx="46" cy="46" r="20" fill="#efede6"/>
      <path d="M46 37v18M37 46h18" stroke="#66645d" stroke-width="2" stroke-linecap="round"/>
      <text x="82" y="54" font-size="18" fill="#96938a">继续说，或者选择上面的一个方向…</text>
      <rect x="762" y="16" width="72" height="60" rx="21" fill="#2f674d"/>
      <path d="M790 46h17m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g opacity="0.72" font-size="11" fill="#85837b">
      <text x="218" y="505" text-anchor="end">拖动调宽</text>
      <text x="1352" y="505">拖动调宽</text>
    </g>
  </g>
</svg>
