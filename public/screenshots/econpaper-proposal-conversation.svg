<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#213329" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f5f3ec"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(52 34)">
      <circle cx="22" cy="22" r="22" fill="#171715"/>
      <text x="22" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="27" fill="#fff">e</text>
      <text x="58" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#1c1c19">econpaper</text>
    </g>

    <g transform="translate(1320 38)">
      <rect width="214" height="44" rx="22" fill="#ebe9e1"/>
      <text x="107" y="28" text-anchor="middle" font-size="15" fill="#585750">方向凝练 · 第 1 步</text>
    </g>

    <line x1="0" y1="108" x2="1600" y2="108" stroke="#dedbd1"/>

    <g transform="translate(320 150)">
      <text x="0" y="24" font-size="15" fill="#85837b">你</text>
      <rect x="0" y="44" width="960" height="82" rx="22" fill="#eceae3"/>
      <text x="28" y="94" font-size="23" fill="#24231f">我想研究数字经济发展是否提高了制造业企业的生产率</text>
    </g>

    <g transform="translate(320 316)">
      <circle cx="20" cy="20" r="20" fill="#2f674d"/>
      <text x="20" y="27" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#fff">e</text>
      <text x="58" y="27" font-size="15" font-weight="700" fill="#2f674d">econpaper</text>

      <text x="58" y="82" font-family="Georgia, 'Songti SC', serif" font-size="27" fill="#21211e">我先忠实保留你的研究意图：</text>
      <text x="58" y="132" font-family="Georgia, 'Songti SC', serif" font-size="31" font-weight="700" fill="#1a1a18">数字经济发展 → 制造业企业 → 生产率</text>
      <text x="58" y="190" font-size="20" fill="#56554f">先不展开整套研究流程。现在只确定下一件事：</text>
      <text x="58" y="232" font-size="22" font-weight="650" fill="#25241f">你最想先弄清哪一种问题？</text>

      <g transform="translate(58 270)" font-size="17">
        <rect width="176" height="52" rx="26" fill="#fff" stroke="#d6d3c8"/>
        <text x="88" y="33" text-anchor="middle" fill="#31302b">整体是否有效</text>

        <rect x="194" width="204" height="52" rx="26" fill="#fff" stroke="#d6d3c8"/>
        <text x="296" y="33" text-anchor="middle" fill="#31302b">哪些企业更明显</text>

        <rect x="416" width="190" height="52" rx="26" fill="#fff" stroke="#d6d3c8"/>
        <text x="511" y="33" text-anchor="middle" fill="#31302b">通过什么机制</text>

        <text x="630" y="33" fill="#77756e">我想自己描述</text>
      </g>

      <text x="58" y="368" font-size="15" fill="#8b8981">你的原话会一直保留；后续步骤只在需要时出现在对话里。</text>
    </g>

    <g transform="translate(320 744)" filter="url(#shadow)">
      <rect width="960" height="94" rx="28" fill="#fffdf8" stroke="#d8d5ca"/>
      <circle cx="48" cy="47" r="21" fill="#efede6"/>
      <path d="M48 37v20M38 47h20" stroke="#66645d" stroke-width="2" stroke-linecap="round"/>
      <text x="86" y="55" font-size="20" fill="#96938a">继续说，或者选择上面的一个方向…</text>
      <rect x="848" y="17" width="76" height="60" rx="22" fill="#2f674d"/>
      <path d="M878 47h17m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
